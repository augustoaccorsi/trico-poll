<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trico-poll · Enviar enquete</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #8b949e;
      margin-bottom: 1.75rem;
    }

    .subtitle strong { color: #e6edf3; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    input[type="password"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus { border-color: #58a6ff; }

    .pat-hint {
      font-size: 0.78rem;
      color: #8b949e;
      margin-bottom: 1.25rem;
    }

    .pat-hint a { color: #58a6ff; }

    .save-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .save-row input[type="checkbox"] { accent-color: #58a6ff; }

    button {
      width: 100%;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1rem;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 1.25rem;
      font-size: 0.875rem;
      border-radius: 6px;
      padding: 0.65rem 0.875rem;
      display: none;
    }

    .status.info    { background: #1f3a5f; color: #79c0ff; display: block; }
    .status.success { background: #1a3828; color: #56d364; display: block; }
    .status.error   { background: #3b1a1a; color: #f85149; display: block; }

    .status a { color: inherit; font-weight: 600; }

    .nav-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.82rem;
      color: #8b949e;
    }

    .nav-link a { color: #58a6ff; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">trico-poll</div>
  <div class="subtitle" id="subtitle">Enviar enquete do Grêmio no WhatsApp</div>

  <label for="pat-input">GitHub Token (actions:write)</label>
  <input type="password" id="pat-input" placeholder="github_pat_…">
  <div class="pat-hint">
    Crie um
    <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">
      fine-grained PAT
    </a>
    com permissão <strong>Actions → Read and write</strong> neste repositório.
  </div>

  <div class="save-row">
    <input type="checkbox" id="save-pat">
    <label for="save-pat" style="text-transform:none;letter-spacing:0;font-size:0.85rem;color:#8b949e;margin:0;">
      Salvar token no navegador (localStorage)
    </label>
  </div>

  <button id="send-btn">Enviar enquete</button>

  <div class="status" id="status"></div>

  <div class="nav-link"><a href="../">← Início</a> · <a href="../test/">Enquete de teste</a></div>
</div>

<script>
  const OWNER = 'augustoaccorsi';
  const REPO  = 'trico-poll';
  const WORKFLOW = 'send-poll.yml';

  const patInput = document.getElementById('pat-input');
  const savePat  = document.getElementById('save-pat');
  const sendBtn  = document.getElementById('send-btn');
  const statusEl = document.getElementById('status');

  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
  document.getElementById('subtitle').innerHTML =
    `Enviar enquete do Grêmio · <strong>${today}</strong>`;

  const saved = localStorage.getItem('gh_pat');
  if (saved) { patInput.value = saved; savePat.checked = true; }

  function setStatus(type, html) {
    statusEl.className = 'status ' + type;
    statusEl.innerHTML = html;
  }

  sendBtn.addEventListener('click', async () => {
    const pat = patInput.value.trim();
    if (!pat) { setStatus('error', 'Informe o GitHub Token.'); return; }

    if (savePat.checked) {
      localStorage.setItem('gh_pat', pat);
    } else {
      localStorage.removeItem('gh_pat');
    }

    sendBtn.disabled = true;
    setStatus('info', 'Disparando workflow…');

    const url = `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`;
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${pat}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ ref: 'main', inputs: { date: today } }),
      });

      if (res.status === 204) {
        const runsUrl = `https://github.com/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}`;
        setStatus('success', `Workflow disparado para <strong>${today}</strong>. <a href="${runsUrl}" target="_blank" rel="noopener">Ver execução →</a>`);
      } else {
        const body = await res.json().catch(() => ({}));
        setStatus('error', `Erro ${res.status}: ${body.message ?? 'falha desconhecida'}`);
      }
    } catch (err) {
      setStatus('error', `Erro de rede: ${err.message}`);
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
