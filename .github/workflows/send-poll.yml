name: Send Grêmio Poll

on:
  schedule:
    - cron: '0 8 * * *' # 5AM BRT (UTC-3, no DST)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to check for matches (YYYY-MM-DD). Defaults to today in BRT.'
        required: false
        default: ''

jobs:
  send-poll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if poll already sent today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          SENT=""
          while IFS=$'\t' read -r id ts; do
            day=$(TZ=America/Sao_Paulo date -d "$ts" +%Y-%m-%d)
            [ "$day" != "$TODAY" ] && continue
            step=$(gh run view "$id" --repo ${{ github.repository }} \
              --json jobs \
              --jq '.jobs[].steps[] | select(.name == "Send poll if match today") | .conclusion // "skipped"')
            if [ "$step" != "skipped" ]; then
              SENT="$id"
              break
            fi
          done < <(gh run list \
            --repo ${{ github.repository }} \
            --workflow send-poll.yml \
            --status success \
            --json databaseId,createdAt \
            --limit 5 \
            | jq -r '.[] | [.databaseId|tostring, .createdAt] | @tsv')
          if [ -n "$SENT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Poll already sent today (run $SENT) — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore WhatsApp session
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.WA_SESSION }}" ]; then
            echo "ERROR: WA_SESSION secret is not set."
            echo "Run 'npm run dev' locally to scan the QR, then encode the session:"
            echo "  tar -czf - auth_info_baileys/ | base64 | gh secret set WA_SESSION -R ${{ github.repository }} --hostname github.com"
            exit 1
          fi
          mkdir -p auth_info_baileys
          echo "${{ secrets.WA_SESSION }}" | base64 -d | tar -xz -C auth_info_baileys

      - name: Send poll if match today
        if: steps.check.outputs.skip != 'true'
        env:
          WA_GROUP_JID: ${{ secrets.WA_GROUP_JID }}
          FORZA_TEAM_ID: '17474'
          TZ_BRASILIA: 'America/Sao_Paulo'
          LOG_LEVEL: 'info'
          POLL_DATE: ${{ github.event.inputs.date }}
        run: npm run send-today

      - name: Save updated session
        if: always() && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_HOST: github.com
        run: |
          NEW_SESSION=$(tar -czf - -C auth_info_baileys . | base64 -w 0)
          echo "$NEW_SESSION" | gh secret set WA_SESSION -R ${{ github.repository }}
